<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Another password game...</title>
  <link rel="stylesheet" href="stylesheetV1.css" />
</head>

<!-- ☀️ Dark Mode Toggle Button -->
<button id="darkModeToggle" class="dark-toggle">☀️</button>

<link id="themeStylesheet" rel="stylesheet" href="stylesheetV2.css" />

<!-- 🎮 Mode Select Button -->
<button id="modeToggleBtn" class="mode-toggle">🎮</button>

<!-- 🧩 Mode Select Popup -->
<div id="modePopup" class="mode-popup hidden">
  <h3>Select Difficulty</h3>
  <button class="mode-btn" data-mode="easy">Easy</button>
  <button class="mode-btn" data-mode="medium">Medium</button>
  <button class="mode-btn" data-mode="hard">Hard</button>
</div>

<!-- ⏱️ Game Mode Selection Popup -->
<div id="gameModePopup" class="mode-popup hidden">
    <h3>Select Game Mode</h3>
    <button class="game-mode-btn" data-gamemode="time">Time Attack</button>
    <button class="game-mode-btn" data-gamemode="trial">Trial Mode</button>
  </div>
  

<body>

<!-- 🏆 Best Guess Section -->
<div id="bestGuess" class="best-guess hidden">
    Best Guess: <span id="bestGuessText">None</span>
  </div>
  
  <!-- 🧠 History Toggle Button -->
  <button id="toggleHistoryBtn" class="toggle-history">🧠 Hint History</button>
  
  <!-- 🗃️ Slide-out History Panel -->
  <div id="historyPanel" class="history-panel">
    <h2>Hint History</h2>
    <div id="historyContent"></div>
  </div>


  <!-- 🕒 Timer Display -->
  <div id="timer" class="game-timer hidden">Time Left: 120s</div>
  
<!-- 🔐 Reveal Password -->
<div id="revealPassword" class="reveal-password hidden"></div>

  <div class="game-container">
    <h1>Another password game...</h1>
    <input type="text" id="guessInput" placeholder="Enter your guess..." />    <button id="submitBtn">Guess</button>
    <p id="feedback"></p>
    <div id="hintContainer" class="hints"></div>
    <p class="attempts">Attempts: <span id="attemptCount">0</span></p>
  </div>


  <script>


    function themedColor(lightModeColor, darkModeColor) {
    return darkMode ? darkModeColor : lightModeColor;
    }

    ////////////////////////////GLOBAL FLAG//////////////////////////////
    let demoMode = true;


    let correctPassword = "APPLW"; // CHANGE PASSWORD
    let attempts = 0;
  
    const input = document.getElementById("guessInput");
    const button = document.getElementById("submitBtn");
    const feedback = document.getElementById("feedback");
    const attemptDisplay = document.getElementById("attemptCount");
    const hintContainer = document.getElementById("hintContainer");
  
    function contains(str, pattern) {
      return pattern.test(str);
    }
  
    function getHintHTML(label, status) {
      if (status === "match") {
        return `<p>✅ ${label}</p>`;
      } else if (status === "mismatch") {
        return `<p>❌ ${label}</p>`;
      } else {
        return `<p>No ${label.toLowerCase()}!</p>`;
      }
    }
  
    function generateHints(password, guess) {
    
    if (password === guess) {
        return []; // No hints if the guess is perfect
    }

    const hints = [];

    const has = {
        spaceP: password.includes(" "),
        spaceG: guess.includes(" "),
        capsP: /[A-Z]/.test(password),
        capsG: /[A-Z]/.test(guess),
        lettersP: /[a-z]/.test(password),
        lettersG: /[a-z]/.test(guess),
        punctP: /[()[\]{}"':;.,?!&~`_-]/.test(password),
        punctG: /[()[\]{}"':;.,?!&~`_-]/.test(guess),
        numsP: /\d/.test(password),
        numsG: /\d/.test(guess),
        specialP: /[@#$%^*=+|\\\/><]/.test(password),
        specialG: /[@#$%^*=+|\\\/><]/.test(guess),
    };

    // if password contains it but guess doesn't->   X (missing component)
    //if guess contains it but passoword doesnt ->   No (component)!
    // if both don't contain it                 ->   show nothing
    // if password and guess contain it         ->   check (component)

    // Space hint
    if (has.spaceP) {
        hints.push(getHintHTML("Space", has.spaceG ? "match" : "mismatch"));
    } else if (has.spaceG) {
        hints.push(getHintHTML("Space", "none"));
    }

    // Caps hint
    if (has.capsP) {
        hints.push(getHintHTML("Caps", has.capsG ? "match" : "mismatch"));
    } else if (has.capsG) {
        hints.push(getHintHTML("Caps", "none"));
    }

    // Letters hint
    if (has.lettersP) {
        hints.push(getHintHTML("Letters", has.lettersG ? "match" : "mismatch"));
    } else if (has.lettersG) {
        hints.push(getHintHTML("Letters", "none"));
    }

    // Punctuation hint
    if (has.punctP) {
        hints.push(getHintHTML("Punctuation characters", has.punctG ? "match" : "mismatch"));
    } else if (has.punctG) {
        hints.push(getHintHTML("Punctuation characters", "none"));
    }

    // Numbers hint
    if (has.numsP) {
        hints.push(getHintHTML("Numbers", has.numsG ? "match" : "mismatch"));
    } else if (has.numsG) {
        hints.push(getHintHTML("Numbers", "none"));
    }

    // Special characters hint
    if (has.specialP) {
        hints.push(getHintHTML("Special characters", has.specialG ? "match" : "mismatch"));
    } else if (has.specialG) {
        hints.push(getHintHTML("Special characters", "none"));
    }

    return hints;
    }

    let timerStarted = false;
    let interval;

    function startTimer() {
    interval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `Time Left: ${timeLeft}s`;

        if (timeLeft === 30) {
        timerDisplay.style.color = "yellow";
        setTimeout(() => timerDisplay.style.color = themedColor("black", "white")
        , 2000);
        }

        if (timeLeft <= 10 && timeLeft > 0) {
        timerDisplay.style.color = timeLeft % 2 === 0 ? "red" : themedColor("black", "white");
        }

        if (timeLeft <= 0) {
        clearInterval(interval);
        timerDisplay.textContent = "Time's up!";
        timerDisplay.style.color = "rgb(239, 0, 0)";

        input.disabled = true;
        button.disabled = true;
        feedback.textContent = "Try again later :(";
        feedback.className = "error";

        revealDiv.textContent = `The correct password was: "${correctPassword}"`;
        revealDiv.classList.remove("hidden");
        revealDiv.classList.add("failure");
        }
    }, 1000);
    }

  
    button.addEventListener("click", () => {
    const guess = input.value.trim();
    if (!timerStarted && selectedGameMode === "time") {
    startTimer();
    timerStarted = true;}

    attempts++;
    attemptDisplay.textContent = attempts;

    const guessLength = guess.length;
    const passwordLength = correctPassword.length;
    const lengthDifference = Math.abs(guessLength - passwordLength);

    hintContainer.innerHTML = "";

    if (guess == correctPassword) {
        clearInterval(interval); // ⛔ Stop timer if running
        timerDisplay.style.color = darkMode ? "hotpink" : "purple"; // 🟣💗 Freeze in color
        feedback.textContent = "✅ Correct! You guessed the password :)";
        feedback.className = "success";
        input.disabled = true;
        button.disabled = true;

        // Generate hints and score even if correct
        const batchHints = generateHints(correctPassword, guess);
        hintContainer.innerHTML = batchHints.join("");
        
        const score = calculateGuessScore(correctPassword, guess, batchHints, 0); // lengthDiff = 0 when correct
        addToHistory(attempts, guess, batchHints, score);

    } else {
        if (guessLength < passwordLength) {
        feedback.className = "warning";
        feedback.textContent = attempts >= 5
            ? `🔒 Too short by ${lengthDifference}`
            : `🔒 Too short!`;
        } else if (guessLength > passwordLength) {
        feedback.className = "warning";
        feedback.textContent = attempts >= 5
            ? `🔒 Too long by ${lengthDifference}`
            : `🔒 Too long!`;
        } else {
        feedback.className = "progress";
        feedback.textContent = "Right length!";
        }

        // Show hints after first attempt
        if (attempts >= 1) {
        const batchHints = generateHints(correctPassword, guess);
        hintContainer.innerHTML = batchHints.join("");

        const score = calculateGuessScore(correctPassword, guess, batchHints, lengthDifference);
        addToHistory(attempts, guess, batchHints, score);

        if (score >= bestScore) {
            bestScore = score;
            bestGuess = guess;
            bestGuessText.textContent = `${guess} |Score: ${score}|`;
            document.getElementById("bestGuess").classList.remove("hidden");
        }
        }
    }

    input.value = "";
    });


    // Allow pressing Enter to submit the guess
    input.addEventListener("keypress", (event) => {
    if (event.key === "Enter") {
        button.click(); // Triggers the same logic as clicking the Guess button
    }
    });

    // Best Guess tracking
    let bestScore = -Infinity;
    let bestGuess = "";
    const bestGuessText = document.getElementById("bestGuessText");
    const historyPanel = document.getElementById("historyPanel");
    const historyContent = document.getElementById("historyContent");
    const toggleHistoryBtn = document.getElementById("toggleHistoryBtn");

    function calculateGuessScore(password, guess, hints, lengthDiff) {
    let score = 0;

    // Base scoring from hints
    for (let hint of hints) {
        if (hint.includes("✅")) score += 1;
        else if (hint.includes("❌") || hint.includes("No ")) score -= 1;
    }

    // Length penalty
    score -= lengthDiff;

    // Position match bonus
    const minLength = Math.min(password.length, guess.length);
    for (let i = 0; i < minLength; i++) {
        if (password[i] === guess[i]) {
        score += 1;
        }
    }

    return score;
    }


    function addToHistory(attemptNum, guess, hints, score) {
    const entry = document.createElement("div");
    entry.classList.add("history-entry");

    const passwordArr = correctPassword.split('');
    const guessArr = guess.split('');
    const matched = Array(passwordArr.length).fill(false);
    const formatted = [];

    // First pass: green for exact matches
    for (let i = 0; i < guessArr.length; i++) {
        if (passwordArr[i] === guessArr[i]) {
        formatted[i] = `<span class="char-match">${guessArr[i]}</span>`;
        matched[i] = true;
        } else {
        formatted[i] = null; // to be filled in second pass
        }
    }

    // Second pass: yellow (wrong position), red (not present)
    for (let i = 0; i < guessArr.length; i++) {
        if (formatted[i] !== null) continue;

        const letter = guessArr[i];
        let found = false;

        for (let j = 0; j < passwordArr.length; j++) {
        if (!matched[j] && passwordArr[j] === letter) {
            matched[j] = true;
            found = true;
            break;
        }
        }

        const colorClass = found ? "char-close" : "char-wrong";
        formatted[i] = `<span class="${colorClass}">${letter}</span>`;
    }

    entry.innerHTML = `
        <p><strong>Attempt #${attemptNum}</strong></p>
        <hr />
        <p>Guess: <code>${formatted.join("")}</code></p>
        <p>Score: ${score}</p>
        ${hints.length > 0 
        ? `<p>Hints:</p>${hints.map(h => `<p>${h.replaceAll('<p>', '').replaceAll('</p>', '')}</p>`).join("")}` 
        : ""
        }`;

    historyContent.prepend(entry);
    }



    toggleHistoryBtn.addEventListener("click", () => {
    historyPanel.classList.toggle("open");
    });

    // Allow clicking the history panel itself to close it
    document.querySelector("#historyPanel h2").addEventListener("click", () => {
    historyPanel.classList.remove("open");
    });


    // Persistent Dark Mode Toggle
    const themeLink = document.getElementById("themeStylesheet");
    const darkModeToggle = document.getElementById("darkModeToggle");

    // Check saved preference
    let darkMode = localStorage.getItem("darkMode") === "true";

    // Apply on page load
    applyTheme();

    darkModeToggle.addEventListener("click", () => {
    darkMode = !darkMode;
    localStorage.setItem("darkMode", darkMode);
    applyTheme();
    });

    function applyTheme() {
    const isDark = darkMode;
    themeLink.setAttribute("href", isDark ? "styling_dark.css" : "styling.css");
    darkModeToggle.textContent = isDark ? "🌙" : "☀️";

    // Dynamically set a class on the <body>
    document.body.classList.toggle("dark-mode", isDark);
    }

    document.addEventListener("keydown", (event) => {
    // Trigger only if Tab is pressed without focusing on input
    if (event.key === "Tab") {
        event.preventDefault(); // Prevent normal tab behavior
        historyPanel.classList.toggle("open");
    }
    });

    let gameMode = "easy"; // default mode

    const modeToggleBtn = document.getElementById("modeToggleBtn");
    const modePopup = document.getElementById("modePopup");
    const modeButtons = document.querySelectorAll(".mode-btn");

    modeToggleBtn.addEventListener("click", () => {
    const modeIsOpen = !modePopup.classList.contains("hidden");
    
    // Always close both popups before deciding what to do
    modePopup.classList.add("hidden");
    gameModePopup.classList.add("hidden");

    // If it was previously closed, open it (toggle behavior)
    if (!modeIsOpen) {
        modePopup.classList.remove("hidden");
    }
    });


    const gameModePopup = document.getElementById("gameModePopup");
    let selectedDifficulty = "easy"; // Default
    let selectedGameMode = "";       // Will store "time" or "trial"

    modeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        selectedDifficulty = btn.dataset.mode;
        modePopup.classList.add("hidden");

        // Show game mode popup
        gameModePopup.classList.remove("hidden");
    });
    });

    const gameModeButtons = document.querySelectorAll(".game-mode-btn");

    gameModeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
        selectedGameMode = btn.dataset.gamemode;
        gameModePopup.classList.add("hidden");

        // You can now use selectedDifficulty and selectedGameMode
        alert(`Difficulty: ${selectedDifficulty}\nGame Mode: ${selectedGameMode}`);
        
        // TODO: Setup actual behavior here
        if (selectedDifficulty === "easy" && selectedGameMode === "time") {
        startTimeAttack();
        }

    });
    });

    // Close popups if clicking outside of them
    document.addEventListener("click", (e) => {
    const isClickInsideModePopup = modePopup.contains(e.target);
    const isClickInsideGameModePopup = gameModePopup.contains(e.target);
    const isClickOnToggle = modeToggleBtn.contains(e.target);

    if (!isClickInsideModePopup && !isClickInsideGameModePopup && !isClickOnToggle) {
        modePopup.classList.add("hidden");
        gameModePopup.classList.add("hidden");
    }
    });

    const timerDisplay = document.getElementById("timer");
    const revealDiv = document.getElementById("revealPassword");

    const easyPasswords = [
    "Cat$4", "BIRD#3", "Zebra9!", "Monk3y!", "Fish_7", "Apple1!", "GR8Duck", "Star$9", "Sky@5", "Lion2$"
    ];

    function startTimeAttack() {
    resetGame();
    demoMode = false;

    document.getElementById("timer").classList.remove("hidden");
    const chosenPassword = easyPasswords[Math.floor(Math.random() * easyPasswords.length)];
    correctPassword = chosenPassword;

    attempts = 0;
    attemptDisplay.textContent = 0;
    input.disabled = false;
    button.disabled = false;
    feedback.textContent = "";
    hintContainer.innerHTML = "";
    historyContent.innerHTML = "";
    bestGuessText.textContent = "None";
    document.getElementById("bestGuess").classList.add("hidden");
    
    timeLeft = 150; //use this to set time
    timerStarted = false;
    timerDisplay.textContent = `Time Left: ${timeLeft}s`;};


    // no timer in demo mode
    timerDisplay.classList.add("hidden");

    function resetGame() {
    attempts = 0;
    bestScore = -Infinity;
    bestGuess = "";
    attemptDisplay.textContent = "0";
    input.value = "";
    input.disabled = false;
    button.disabled = false;
    feedback.textContent = "";
    hintContainer.innerHTML = "";
    historyContent.innerHTML = "";
    revealDiv.classList.add("hidden");
    revealDiv.textContent = "";
    timerDisplay.classList.add("hidden");
    timerDisplay.textContent = "Time Left: 120s";
    document.getElementById("bestGuess").classList.add("hidden");
    bestGuessText.textContent = "None";
    }

  </script>
